name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install CURL via Chocolatey
        run: choco install curl -y

      - name: Configure CMake
        working-directory: ${{ github.workspace }}\repo
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCURL_DIR="C:\Program Files\Curl\lib\cmake\CURL"

      - name: Build
        working-directory: ${{ github.workspace }}\repo
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: explorers.exe
          path: build/Release/explorers.exe
          retention-days: 30